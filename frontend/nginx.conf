server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой маршрут отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проба liveness: файл healthz.json отдаётся по контрактному пути /healthz
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files /healthz.json =404;
    }

    # Статика с content-hash в имени — можно кэшировать надолго
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
